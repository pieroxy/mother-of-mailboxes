<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Spam detection and routing rules for any IMAP mailbox">
  <!-- The toolbar's color, for the browser's own bar; dark built-in controls (scrollbars, pickers, selects). -->
  <meta name="theme-color" content="#200414">
  <meta name="color-scheme" content="dark">
  <title>MOM</title>
  <link rel="icon" type="image/png" href="/icons/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
  <link rel="shortcut icon" href="/icons/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="MOM" />
  <!-- Home-screen shortcut opens in its own window; "black", not "black-translucent", which would draw the page under the status bar. -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <link rel="manifest" href="/icons/site.webmanifest" />
</head>

  <div id="app"></div>
</body>
